name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: the long simulation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # ARCHITECTURE.md section 5: 500 simulated runs per pull request, 10,000 nightly.
      - name: Build and test
        run: ./gradlew build -PsimRuns=${{ github.event_name == 'schedule' && '10000' || '500' }} --console=plain
